# A known-good resolution of requirements.txt, frozen from a working NVIDIA
# image on 2026-09-08. Not installed by the Dockerfile, and deliberately so.
#
# requirements.txt pins nothing but floors, because whisperx resolves torch,
# transformers, pyannote and numpy as a set and pinning them by hand breaks
# that. The cost is that two people cloning a month apart get different code,
# and this file is the antidote: when a fresh build misbehaves and this one
# did not, diff the two.
#
# Installing from this file directly will fetch CPU torch from PyPI. The
# Dockerfile installs torch from the cu128 index FIRST for exactly that reason
# — sm_120 has no kernels in the default wheels. If you use this file, install
# torch the way the Dockerfile does, then:
#
#     pip install --no-deps -r requirements.lock
#
