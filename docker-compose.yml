name: transcribe

# One command. No .env to copy, no profile to choose.
#
#   docker compose up                                                  NVIDIA GPU
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up  everything else
#
# The application picks its own backend at runtime — faster-whisper when it can
# see a CUDA device, whisper.cpp otherwise (app/config.py, resolve_backend). The
# only thing it cannot decide for itself is whether Docker hands it a GPU in the
# first place, because Compose resolves that on the host before any container
# exists. Hence exactly two commands, and the second one is in the line above.

x-llm: &llm
  environment: &llm-env
    # Verified to exist: Qwen/Qwen3-8B-GGUF -> Qwen3-8B-Q4_K_M.gguf (~5 GB).
    # These two must always name the SAME model. llama.cpp treats the URL as
    # authoritative and re-downloads it over the file path, so pointing MODEL at
    # another GGUF while MODEL_URL still names this one silently overwrites it —
    # the server then reports the path you asked for while serving the wrong
    # weights. Change both together or neither.
    LLAMA_ARG_MODEL_URL: ${LLM_MODEL_URL:-https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf}
    LLAMA_ARG_MODEL: /models/${LLM_MODEL_FILE:-llm.gguf}
    LLAMA_ARG_ALIAS: ${LLM_MODEL:-qwen3-8b-instruct}
    LLAMA_ARG_CTX_SIZE: "8192"
    LLAMA_ARG_PORT: "8081"
    LLAMA_ARG_HOST: "0.0.0.0"
  volumes: ["./cache/llm:/models"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
    interval: 15s
    timeout: 5s
    retries: 60
    # The model downloads on first start; give it room before failing.
    start_period: 900s

services:
  app:
    image: ghcr.io/clevertify/whisper-teams-merge:cuda
    build:
      context: .
      dockerfile: Dockerfile
      args: {BACKEND: nvidia}
    # Optional, and optional on purpose: every setting has a working default in
    # app/config.py, so there is nothing to copy before the first run. Written
    # long-hand because the short form `env_file: [.env]` means required:true,
    # and a missing file aborted the whole `up` before anything started.
    env_file:
      - path: .env
        required: false
    # >>> No NVIDIA GPU? This line is the one that fails, with
    # >>>   could not select device driver "" with capabilities: [[gpu]]
    # >>> Run this instead — same stack, CPU build, one command:
    # >>>   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up
    gpus: all
    volumes:
      - ./input:/work/input
      - ./output:/work/output
      - ./cache:/cache
      # Bind-mounted so code changes take effect without a rebuild. Read-only:
      # nothing in the container writes to its own source, and a writable source
      # tree under a long-running service is a needless foothold.
      - ./app:/work/app:ro
      - ./scripts:/work/scripts:ro
      - ./tests:/work/tests:ro
      # Benchmark output. Untracked — everything here is derived from whatever
      # recording you scored, so it is yours, not the repo's.
      - ./bench:/work/bench
    ports: ["127.0.0.1:8080:8080"]
    shm_size: "8gb"
    restart: unless-stopped
    depends_on: [llm]

  llm:
    <<: *llm
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    gpus: all
    environment:
      <<: *llm-env
      LLAMA_ARG_N_GPU_LAYERS: "99"
    # ASR and the merge never run together, but the model would otherwise hold
    # ~5.9 GB of 12 through the whole transcription. Sleeping when idle hands
    # that back to Whisper and pyannote, and the next request wakes it.
    command: ["--sleep-idle-seconds", "${LLM_SLEEP_IDLE_SECONDS:-60}"]

  # ---- vision, for screen recordings --------------------------------------
  # Its own service rather than a second model inside `llm`: llama.cpp's router
  # mode does not release GPU memory when a model idles out, and does not
  # enforce its model cap under concurrency. Both are fatal on a 12 GB card.
  #
  # 5.9 GB of text model and ~6 GB of vision model cannot both be resident, so
  # the pipeline waits on genuinely free VRAM before loading either. Audio-only
  # jobs never load this at all — the model evicts itself when idle.
  llm-vision:
    <<: *llm
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    gpus: all
    environment:
      LLAMA_ARG_MODEL: /models/qwen3vl-8b-q4km.gguf
      LLAMA_ARG_MODEL_URL: https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/main/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      # The projector is a separate file and a separate download. Without it,
      # llama.cpp serves a perfectly healthy *text-only* model that accepts an
      # image, silently ignores it, and invents a description — which is why the
      # pipeline runs a nonce probe before trusting anything this service says.
      LLAMA_ARG_MMPROJ: /models/qwen3vl-8b-mmproj.gguf
      LLAMA_ARG_MMPROJ_URL: https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
      LLAMA_ARG_ALIAS: ${SCREEN_VLM_MODEL:-qwen3-vl-8b}
      # A 1280px screenshot costs 1-2k tokens, so the text service's 8192 would
      # hold barely a couple of frames plus the prompt.
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_PORT: "8081"
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_N_GPU_LAYERS: "99"
    command: ["--sleep-idle-seconds", "${SCREEN_VLM_SLEEP_IDLE_SECONDS:-120}"]
