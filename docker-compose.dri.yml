# Hand an AMD or Intel GPU to whisper.cpp's Vulkan backend.
#
# Stacks on top of the CPU overlay, which is the one that selects the non-CUDA
# build in the first place:
#
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml \
#                  -f docker-compose.dri.yml up
#
# Linux only. /dev/dri is the kernel's direct-rendering interface and does not
# exist under Docker Desktop on macOS or Windows, where Docker runs inside a VM
# with no GPU passthrough. Docker fails the whole `up` when a listed device is
# missing rather than ignoring it, which is why this is a separate file rather
# than a line in docker-compose.yml.
#
# Without it everything still works, just on CPU. Check `ls /dev/dri` first; if
# that path does not exist, this file will not help you.
services:
  app:
    devices:
      - /dev/dri:/dev/dri
